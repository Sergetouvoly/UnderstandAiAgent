# Jupyter Book : « Comprendre et développer des agents IA spécialisés »
# Construire : jupyter-book build .      (voir PUBLIER.md)

title: Comprendre et développer des agents IA spécialisés
author: Doudou Serge
copyright: " Octobre 2026"

# Les notebooks appellent l'API OpenAI : on affiche leurs sorties enregistrées,
# on ne les réexécute jamais pendant la construction du livre.
execute:
  execute_notebooks: "off"

# Sources du livre = les fichiers listés dans _toc.yml ; le reste est écarté.
exclude_patterns:
  - ".venv*/**"
  - "_build/**"
  - "ancien/**"
  - "secours/**"
  - ".claude/**"
  - ".github/**"
  - "assets/*.md"
  - "assets/nocode/donnees/**"
  - "README.md"
  - "PUBLIER.md"
  - "REFERENTIEL_DJASSA.md"
  - "**/.ipynb_checkpoints/**"

repository:
  url: https://github.com/Sergetouvoly/UnderstandAiAgent
  branch: main

html:
  favicon: assets/icons/agent-raisonnement.png
  use_repository_button: true
  use_issues_button: false
  use_edit_page_button: false
  home_page_in_navbar: true
  baseurl: https://sergetouvoly.github.io/UnderstandAiAgent/
  extra_footer: |
    <p style="font-size:0.85em">Présentation « Comprendre et développer des agents IA spécialisés », par Doudou Serge.
    Icônes des schémas : Icons created by Magnific - <a href="https://www.flaticon.com">Flaticon</a>.</p>

parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - html_image
    - substitution

sphinx:
  extra_extensions:
    - sphinxcontrib.mermaid
  local_extensions:
    copier_assets: _ext
  config:
    myst_fence_as_directive: ["mermaid"]
    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    html_static_path: ["_static"]
    html_css_files: ["livre.css"]
    nb_render_markdown_format: myst
    suppress_warnings: ["mystnb.unknown_mime_type"]
