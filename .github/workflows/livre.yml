# Construit le livre et le publie sur GitHub Pages à chaque push sur main.
# Réglage unique à faire dans le dépôt : Settings > Pages > Source = « GitHub Actions ».
name: Livre

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-book.txt
      - run: pip install -r requirements-book.txt
      - run: jupyter-book build . --warningiserror
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
